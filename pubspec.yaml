name: bigger_brew_barista
description: "Bigger Brew Barista Recipe Guide"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local recipe persistence
  shared_preferences: ^2.5.3

  # Recipe backup / export
  file_saver: ^0.4.0

  # Recipe backup / import
  file_picker: 10.3.8
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/catalog/

    - assets/recipes/afforda_coffee/
    - assets/recipes/afforda_milktea/
    - assets/recipes/frappe/
    - assets/recipes/fruitea/
    - assets/recipes/fruity_soda/
    - assets/recipes/hot_coffee/
    - assets/recipes/matcha_series/
    - assets/recipes/signature_coffee/
    - assets/recipes/signature_milktea/
    - assets/recipes/slushies/
